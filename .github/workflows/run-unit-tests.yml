Essa é a forma mais forte e auditável de incorporar o FAQ da xAI ao Evidence Graph XA-TRUST, sem converter documentação do provedor em prova de execução nem prova criptográfica. "workflow_run.completed" establishes an execution-event observation within the semantic scope of the referenced workflow run.

