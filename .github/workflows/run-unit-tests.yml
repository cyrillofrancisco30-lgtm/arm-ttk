E3 ↛ E7

E4 ↛ E5
E4 ↛ E6
E4 ↛ E7

E5 ↛ E6
E5 ↛ E7

E6 ↛ E7

Consequentemente:

E1/E2/E3/E4/E5
    ↛
VERIFIED

e:

E6
    ↛
