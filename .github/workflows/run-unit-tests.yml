E:

E1–E7
=
TYPED EVIDENCE / EVENT / RESULT NODES

relacionados por:

BINDING
RESOLUTION
PROVENANCE
EVALUATION

e não por implicação automática ou herança de estado.

Regra final

NO AUTOMATIC PROMOTION

Nenhum artefato, configuração, execução, resultado, hash, assinatura, evento de verificação ou resultado "PASS", isoladamente, constitui "VERIFIED".

"VERIFIED" é uma propriedade claim-scoped produzida por uma decisão de promoção, após o conjunto de evidências, bindings, verificações e política exigidos terem sido efetivamente satisfeitos.

