name: Homologation runner

on:
  workflow_dispatch:
    inputs:
      ruid:
        description: Run unique ID
        required: true
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  homologation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r ci/requirements.txt

      - name: Generate evidence manifest
        env:
          RUID: ${{ github.event_name == 'workflow_dispatch' && inputs.ruid || github.run_id }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          manifest = {
              "schema_version": "1.0.0",
              "ruid": os.environ.get("RUID", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "status": "generated"
          }
          with open("evidence/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          PY

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30

