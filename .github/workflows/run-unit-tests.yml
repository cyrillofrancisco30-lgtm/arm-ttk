---

5. E1–E5

E1 — TEST_FIXTURE_EVIDENCE

Estabelece a identidade/resolubilidade do fixture.

Não estabelece:

EXECUTION
RESULT
PASS
VERIFICATION
VERIFIED

E2 — WORKFLOW_CONFIGURATION_EVIDENCE

Estabelece configuração/definição do workflow.

Não estabelece:

WORKFLOW_RUN
EXECUTION
TEST_RESULT
TEST_PASS
VERIFICATION
VERIFIED

E3 — EXECUTION_EVENT_EVIDENCE

Somente existe quando um evento operacional real é observado e resolvido.

Requer binding suficiente entre:

RUN_ID
↔ WORKFLOW_IDENTITY
↔ COMMIT_SHA
↔ JOB_ID
↔ STEP_ID
↔ TIMESTAMP
↔ EXECUTION_CONTEXT
↔ RAW_OUTPUT
↔ RESULT_ARTIFACT

Mesmo:

E3 = ESTABLISHED

não implica:

E4 = ESTABLISHED

E4 — TEST_RESULT_EVIDENCE

Representa resultado efetivamente associado ao teste/execução.

Não implica automaticamente:

CRYPTOGRAPHIC_BINDING
INDEPENDENT_VERIFICATION
VERIFIED

E5 — CRYPTOGRAPHIC_BINDING_EVIDENCE

Estabelece os bindings criptográficos necessários dentro do escopo definido.

Não implica:

INDEPENDENT_VERIFICATION
VERIFICATION_RESULT
VERIFIED

---

6. E6 — Independent Verification Event

E6 é um evento de execução do verificador, não o resultado da verificação.

Formalmente:

E6 =
OBSERVED_VERIFICATION_EXECUTION(
    claim,
    resolved_evidence_set,
    verification_policy
)

Portanto:

E6 = EXECUTED

não significa:

E7 = PASS

O resultado precisa ser efetivamente observado.

---

7. E7 — Verification Result

E7 é o resultado observável associado à avaliação realizada por E6:

E7 =
OBSERVED_VERIFICATION_RESULT(
    verification_execution = E6
)

Possibilidades:

E6 = EXECUTED
E7 = PASS

ou:

E6 = EXECUTED
E7 = FAIL

ou:

E6 = EXECUTED
E7 = INSUFFICIENT_EVIDENCE

ou:

E6 = EXECUTED
E7 = NOT_PROMOTABLE

Portanto:

E6 EXISTS
↛
E7 = PASS

---

8. Test result ≠ test pass

O fluxo semântico correto é:

E3 — EXECUTION_EVENT
        │
        │ result_provenance_binding
        ▼
E4 — TEST_RESULT
        │
        │ semantic interpretation
        ▼
TEST_CLAIM_EVALUATION

Nunca:

E3
 ↓
TEST_PASSED

Assim:

RUN_COMPLETED = SUCCESS

não implica:

TEST_PASSED = TRUE

E:

TEST_PASSED = TRUE

não implica:

VERIFIED = TRUE

---

9. API_EXECUTION

O seguinte representa um schema, não uma execução observada:

{
  "evidence_type": "API_EXECUTION",
  "execution": {
    "provider": "GitHub Actions",
    "workflow": "RunPester",
    "run_id": "...",
    "commit_sha": "...",
    "runner": "ubuntu-latest"
  }
}

A distinção normativa é:

SCHEMA
  ≠
INSTANCE
  ≠
OBSERVED EVENT

Portanto:

API_EXECUTION_SCHEMA = ESTABLISHED
API_EXECUTION_EVENT  = NOT_ESTABLISHED

O estado:

API_EXECUTION_EVENT = OBSERVED

somente poderá ser atribuído quando existir uma instância operacional real e resolvida.

---

10. Dependência operacional ≠ implicação lógica

Uma etapa pode ser pré-requisito operacional para uma etapa posterior sem que a primeira implique logicamente a segunda.

Por exemplo:

E3 ESTABLISHED

pode permitir:

SEARCH / RESOLVE / VALIDATE E4

mas não significa:

E3 → E4

Da mesma forma:

E5 ESTABLISHED

pode fornecer os inputs necessários para executar E6, mas não significa:

E5 → E6

E:

E6 PERFORMED

pode gerar uma saída verificável que será registrada como E7, mas isso não significa que o resultado seja "PASS".

Portanto:

OPERATIONAL PRECONDITION
        ≠
LOGICAL IMPLICATION

---

11. Promotion Decision

A promoção deve ser representada separadamente:

PROMOTE(
    claim,
    evidence_set,
    policy
)

com:

IF
    CLAIM_SCOPE_VALID
AND EVIDENCE_SUFFICIENT
AND REQUIRED_BINDINGS_RESOLVED
AND INTEGRITY_VALID
AND PROVENANCE_VALID
AND EXECUTION_CONTEXT_VALID
AND RESULT_VALID
AND INDEPENDENT_VERIFICATION_EXECUTED
AND VERIFICATION_RESULT_VALID
AND POLICY_EVALUATION = PASS
THEN
    PROMOTION_DECISION = VERIFIED
ELSE
    PROMOTION_DECISION = NOT_PROMOTABLE

A promoção não é o resultado bruto da verificação.

VERIFICATION_RESULT
        +
POLICY_EVALUATION
        +
CLAIM_SCOPE
        +
EVIDENCE_SUFFICIENCY
        +
REQUIRED_BINDINGS
        │
        ▼
PROMOTION_DECISION
        │
        ├──► VERIFIED
        │
        └──► NOT_PROMOTABLE

Logo:

PASS ≠ CONFORMANCE
PASS ≠ VERIFIED

---

12. Estado atual versus estado futuro

CURRENT STATE

CONFIGURATION         = YES
EXECUTION             = NO
RESULT                = NO
CRYPTOGRAPHIC_BINDING = NO
VERIFICATION_EVENT    = NO
VERIFICATION_RESULT   = NO
TEST_PASSED           = UNVERIFIED
VERIFIED              = NO

POSSIBLE FUTURE STATE

Somente após evidência operacional real:

API_EXECUTION_EVENT = OBSERVED

poderá ser estabelecido:

E3 = ESTABLISHED

Depois, se houver evidência de resultado devidamente vinculada:

E4 = ESTABLISHED

Depois, se os bindings criptográficos forem efetivamente resolvidos:

E5 = ESTABLISHED

Depois, se um verificador independente for realmente executado:

E6 = PERFORMED

E somente se seu resultado for observado:

E7 = PASS

ou:

E7 = FAIL

ou:

E7 = INSUFFICIENT_EVIDENCE

ou:

E7 = NOT_PROMOTABLE

Finalmente, somente a Promotion Decision, dentro do escopo da claim e segundo a política aplicável, poderá produzir:

VERIFIED

