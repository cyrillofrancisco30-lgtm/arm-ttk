{
  "claim_id": "CI_AUTOMATED_TEST_EXECUTION",
  "evidence_type": "ExternalServiceEvent",
  "provider": "GitHub Actions",
  "repository": "cyrillofrancisco30-lgtm/arm-ttk",
  "workflow": "RunPester",
  "workflow_file": ".github/workflows/run-unit-tests.yml",
  "execution_environment": "ubuntu-latest",
  "test_framework": "Pester",
  "result_artifact": "**.TestResults.xml",
  "provenance": {
    "upstream": "Azure/arm-ttk",
    "repository_type": "FORK"
  }
}﻿
name: RunPester
on: 
  workflow_dispatch: 
  push: 
  pull_request: 
jobs: 
  TestPowerShellOnLinux: 
    runs-on: ubuntu-latest
    steps: 
      - name: Check out repository
        uses: actions/checkout@v4
      - name: InstallPester
        id: InstallPester
        shell: pwsh
        run: |
          $Parameters = @{}
          $Parameters.PesterMaxVersion = ${env:PesterMaxVersion}
          foreach ($k in @($parameters.Keys)) {
              if ([String]::IsNullOrEmpty($parameters[$k])) {
                  $parameters.Remove($k)
              }
          }
          Write-Host "::debug:: InstallPester $(@(foreach ($p in $Parameters.GetEnumerator()) {'-' + $p.Key + ' ' + $p.Value}) -join ' ')"
          & './arm-ttk/GitHubWorkflow/Steps/InstallPester.ps1' @Parameters
      - name: RunPester
        id: RunPester
        shell: pwsh
        run: |
          $Parameters = @{}
          $Parameters.ModulePath = ${env:ModulePath}
          $Parameters.PesterMaxVersion = ${env:PesterMaxVersion}
          foreach ($k in @($parameters.Keys)) {
              if ([String]::IsNullOrEmpty($parameters[$k])) {
                  $parameters.Remove($k)
              }
          }
          Write-Host "::debug:: RunPester $(@(foreach ($p in $Parameters.GetEnumerator()) {'-' + $p.Key + ' ' + $p.Value}) -join ' ')"
          & './arm-ttk/GitHubWorkflow/Steps/RunPester.ps1' @Parameters
      - name: PublishTestResults
        uses: actions/upload-artifact@v4
        with: 
          name: PesterResults
          path: '**.TestResults.xml'
        if: ${{always()}}
env: 
  ModulePath: .\arm-ttk\arm-ttk.psd1
